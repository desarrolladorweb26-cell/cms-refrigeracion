<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMS Servicios Generales Refrigeración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 50: '#eef8ff', 100: '#d8efff', 500: '#0088cc', 600: '#006699', 700: '#004f77', 900: '#002b42' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-[100dvh] flex flex-col justify-between" x-data="app()">

    <!-- HEADER DINÁMICO -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-11 h-11 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-snowflake text-xl"></i>
                </div>
                <div>
                    <h1 x-text="config.headerTitle" class="text-sm sm:text-base font-bold text-slate-900 tracking-tight leading-tight"></h1>
                    <p x-text="config.headerSubtitle" class="text-xs font-semibold text-brand-600 tracking-wider"></p>
                </div>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
                <a href="#servicios" class="hover:text-brand-600">Servicios</a>
                <a href="#reserva" @click.prevent="openBookingModal()" class="text-brand-600 font-semibold">Pedir Turno</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="bg-slate-900 text-white py-16 px-4 text-center">
            <h2 class="text-3xl sm:text-5xl font-extrabold mb-6">Climatización experta</h2>
            <button @click="openBookingModal()" class="px-8 py-4 bg-brand-500 text-white font-bold rounded-xl mb-4">Solicitar Turno Ahora</button>
            <a href="https://wa.me/5493402440000" target="_blank" class="px-8 py-4 border border-white/20 rounded-xl inline-flex items-center gap-2"><i class="fa-brands fa-whatsapp text-green-400"></i> Consulta Rápida</a>
        </section>

        <!-- SECCIÓN CARRUSEL (Con las fotos que armamos) -->
        <section class="py-12 max-w-5xl mx-auto px-4" x-data="{ current: 0, slides: [
                { image: 'https://images.unsplash.com/photo-1599839619722-39751411ea63?q=80&w=1000', title: 'Instalaciones Profesionales', desc: 'Montaje de equipos con materiales de primera calidad.' }, 
                { image: 'https://images.unsplash.com/photo-1621905252507-b35492cc74b4?q=80&w=1000', title: 'Mantenimiento Preventivo', desc: 'Alargá la vida útil de tu aire acondicionado.' }, 
                { image: 'https://images.unsplash.com/photo-1581094288338-2314dddb7ece?q=80&w=1000', title: 'Reparaciones Rápidas', desc: 'Soluciones en el día con garantía escrita.' }
            ]}">
            <div class="relative w-full h-72 sm:h-96 rounded-2xl overflow-hidden shadow-xl border border-slate-200 group">
                <template x-for="(slide, index) in slides" :key="index">
                    <div x-show="current === index" x-transition.opacity.duration.500ms class="absolute inset-0 w-full h-full">
                        <img :src="slide.image" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent"></div>
                        <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-10 text-white text-center sm:text-left">
                            <h4 class="text-2xl sm:text-4xl font-bold mb-2 drop-shadow-lg" x-text="slide.title"></h4>
                            <p class="text-sm sm:text-lg text-slate-200 drop-shadow-md max-w-2xl" x-text="slide.desc"></p>
                        </div>
                    </div>
                </template>
                <button @click="current = current === 0 ? slides.length - 1 : current - 1" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white text-white hover:text-brand-600 w-10 h-10 rounded-full flex items-center justify-center transition-all opacity-0 group-hover:opacity-100 shadow-lg"><i class="fa-solid fa-chevron-left"></i></button>
                <button @click="current = current === slides.length - 1 ? 0 : current + 1" class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white text-white hover:text-brand-600 w-10 h-10 rounded-full flex items-center justify-center transition-all opacity-0 group-hover:opacity-100 shadow-lg"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- SECCIÓN SERVICIOS -->
        <section id="servicios" class="py-12 px-4 max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Se mantienen tus 6 tarjetas de servicio idénticas, para ahorrar espacio acá pongo 1 de ejemplo pero en el tuyo copialas todas! -->
                <div class="bg-white p-6 border rounded-2xl shadow-sm text-center">
                    <h4 class="font-bold mb-2">Instalación Split</h4>
                    <button @click="selectServiceAndBook('Instalación')" class="w-full py-2 bg-slate-100 text-sm font-semibold rounded-xl hover:bg-brand-500 hover:text-white transition-colors">Reservar</button>
                </div>
                 <div class="bg-white p-6 border rounded-2xl shadow-sm text-center">
                    <h4 class="font-bold mb-2">Reparación y Carga</h4>
                    <button @click="selectServiceAndBook('Reparación')" class="w-full py-2 bg-slate-100 text-sm font-semibold rounded-xl hover:bg-brand-500 hover:text-white transition-colors">Reservar</button>
                </div>
                 <div class="bg-white p-6 border rounded-2xl shadow-sm text-center">
                    <h4 class="font-bold mb-2">Mantenimiento</h4>
                    <button @click="selectServiceAndBook('Mantenimiento')" class="w-full py-2 bg-slate-100 text-sm font-semibold rounded-xl hover:bg-brand-500 hover:text-white transition-colors">Reservar</button>
                </div>
            </div>
        </section>

        <!-- NUEVA SECCIÓN: RESEÑAS -->
        <section class="py-16 bg-slate-100 px-4 border-t border-slate-200">
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Formulario de Reseñas -->
                <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h4 class="font-bold text-lg mb-2 text-slate-800">Dejanos tu opinión</h4>
                    <p class="text-xs text-slate-500 mb-5">Tu experiencia nos ayuda a mejorar el servicio.</p>
                    <form @submit.prevent="submitReview()">
                        <input type="text" x-model="reviewForm.name" required placeholder="Tu Nombre o Apellido" class="w-full mb-3 px-4 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:border-brand-500">
                        <div class="relative">
                            <textarea x-model="reviewForm.text" required maxlength="100" rows="3" placeholder="Excelente trabajo, muy puntual..." class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm outline-none focus:border-brand-500 resize-none"></textarea>
                            <span class="absolute bottom-3 right-3 text-[10px] font-bold text-slate-400" x-text="reviewForm.text.length + '/100'"></span>
                        </div>
                        <button type="submit" class="w-full mt-3 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm transition-colors flex justify-center">
                            <span x-show="!isSubmittingReview">Publicar Reseña</span>
                            <span x-show="isSubmittingReview"><i class="fa-solid fa-spinner fa-spin"></i></span>
                        </button>
                    </form>
                </div>
                
                <!-- Lista de Reseñas -->
                <div class="md:col-span-2">
                    <h4 class="font-bold text-lg mb-5 text-slate-800">Lo que dicen nuestros clientes</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <template x-for="(rev, index) in reviews" :key="index">
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden">
                                <i class="fa-solid fa-quote-right absolute -top-2 -right-2 text-slate-50 text-5xl"></i>
                                <div class="flex items-center gap-1 text-amber-400 text-[10px] mb-2 relative z-10">
                                    <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                                </div>
                                <p class="text-sm text-slate-600 italic mb-3 relative z-10 font-medium" x-text="'&quot;' + rev.text + '&quot;'"></p>
                                <p class="text-xs font-bold text-slate-800 relative z-10">— <span x-text="rev.name"></span></p>
                            </div>
                        </template>
                        <div x-show="reviews.length === 0" class="col-span-2 text-sm text-slate-500 bg-white p-4 rounded-xl border border-slate-200 text-center">Aún no hay reseñas. ¡Sé el primero en opinar!</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER Y CONTADOR DE VISITAS -->
    <footer class="bg-white border-t py-8 px-4 text-slate-500 pb-24">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left flex flex-col items-center sm:items-start">
                <p x-text="config.footerCopyright" class="font-bold text-xs"></p>
                <p x-text="config.footerText" class="text-xs mt-1"></p>
                <!-- Badge Contador -->
                <div class="mt-3 flex items-center gap-2 px-3 py-1 bg-brand-50 border border-brand-100 rounded-full text-brand-600" title="Total de visitas a la página">
                    <i class="fa-regular fa-eye text-xs"></i>
                    <span class="text-[10px] font-bold tracking-wider">VISITAS: <span x-text="config.visitas"></span></span>
                </div>
            </div>
            <button @click="openAdminLogin()" class="p-2 text-slate-400 hover:text-brand-600 bg-slate-100 rounded-lg"><i class="fa-solid fa-gear text-xl"></i></button>
        </div>
    </footer>

    <!-- BOTÓN WHATSAPP -->
    <a href="https://wa.me/5493402440000" target="_blank" class="fixed bottom-6 right-6 z-30 w-14 h-14 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-xl hover:scale-110 text-2xl"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- MODALES (Omito el código del modal de reserva por espacio, ¡dejá el tuyo como lo tenías!) -->
    
    <!-- ADMIN LOGIN (El placeholder oculto) -->
    <div x-show="adminLoginModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center">
            <h3 class="font-bold mb-4">Ingreso cPanel Admin</h3>
            <input type="password" x-model="adminPasswordInput" placeholder="Contraseña" class="w-full p-3 border rounded-xl mb-4 text-center">
            <button @click="verifyAdminPassword()" class="w-full p-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition-colors">Entrar</button>
            <button @click="adminLoginModal = false" class="w-full p-3 mt-2 text-sm text-slate-500 hover:text-slate-800">Cancelar</button>
        </div>
    </div>

    <!-- PANEL ADMIN (Mismo código de antes) -->
    
    <script>
        // ========================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGh4Ojk1kuAbqlSS9H5XZRD6Z5xTU6pvEfhgFzHfs_c6e6uOe0lNzDDVuu9YHL9Udo/exec'; 
        // ========================================================

        function app() {
            return {
                bookingModalOpen: false, adminLoginModal: false, adminPanelOpen: false,
                adminPasswordInput: '', isSubmitting: false, loadingAdmin: false, isSavingConfig: false,
                adminTab: 'turnos',
                form: { name: '', phone: '', service: '', refrigerant: 'No sé', date: '', timeSlot: '', address: '', notes: '', status: 'Pendiente' },
                appointments: [],
                reviews: [],
                reviewForm: { name: '', text: '' },
                isSubmittingReview: false,
                config: { 
                    headerTitle: 'CMS SERVICIOS GENERALES', headerSubtitle: 'REFRIGERACIÓN', 
                    footerText: 'Especialistas en climatización', footerCopyright: '© 2026', visitas: 0 
                },

                init() {
                    this.fetchPublicData();
                    this.registerVisit();
                },

                // Trae Config y Reseñas (Para los visitantes)
                async fetchPublicData() {
                    if(GOOGLE_SCRIPT_URL.includes('URL_DE_TU')) return;
                    try {
                        const res = await fetch(GOOGLE_SCRIPT_URL);
                        const data = await res.json();
                        if (data.config) this.config = data.config;
                        if (data.reviews) this.reviews = data.reviews;
                    } catch(e) {}
                },

                // Suma 1 visita (1 sola vez por cliente para no inflar los números falsamente)
                async registerVisit() {
                    if(GOOGLE_SCRIPT_URL.includes('URL_DE_TU')) return;
                    if(!localStorage.getItem('cms_visited_v2')) {
                        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'visit' }) });
                        localStorage.setItem('cms_visited_v2', 'true');
                    }
                },

                // Enviar Reseña
                async submitReview() {
                    if(GOOGLE_SCRIPT_URL.includes('URL_DE_TU')) return;
                    this.isSubmittingReview = true;
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addReview', ...this.reviewForm }) });
                        // Muestra la reseña al instante en la pantalla
                        this.reviews.unshift({ name: this.reviewForm.name, text: this.reviewForm.text });
                        this.reviewForm = { name: '', text: '' };
                        alert('¡Muchas gracias por dejarnos tu opinión!');
                    } catch(e) { alert("Hubo un error"); }
                    this.isSubmittingReview = false;
                },

                // MODAL RESERVA Y TURNOS (Mismo código de antes...)
                openAdminLogin() { this.adminPasswordInput = ''; this.adminLoginModal = true; },
                
                verifyAdminPassword() {
                    if (this.adminPasswordInput === '1234' || this.adminPasswordInput === 'admin') {
                        this.adminLoginModal = false; this.adminPanelOpen = true; this.fetchAdminData();
                    } else { alert("Contraseña incorrecta"); }
                },

                // Trae TODO (Turnos, Config, Reseñas) solo si pone la clave
                async fetchAdminData() {
                    this.loadingAdmin = true;
                    try {
                        // Le agregamos ?admin=true a la URL por seguridad
                        const res = await fetch(GOOGLE_SCRIPT_URL + "?admin=true");
                        const data = await res.json();
                        this.appointments = data.appointments || [];
                        if (data.config) this.config = data.config;
                    } catch(e) { console.error(e); }
                    this.loadingAdmin = false;
                }
            }
        }
    </script>
</body>
</html>
